name: Package contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DDP_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres dbname=postgres
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libodbc2
      - run: python -m pip install build twine
      - run: python scripts/smoke_install.py
      - if: matrix.python == '3.10'
        run: python scripts/smoke_install.py --constraints tests/consumer-constraints.txt
