[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddp-connectors"
version = "0.2.0"
description = "Canonical Deepkube Data Platform database and file connectors"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
authors = [{name = "Berexia DEV Team", email = "berexiadev@berexia.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "ddp-lib>=0.2.0,<0.3",
    "loguru>=0.6,<1",
    "SQLAlchemy>=1.4,<3",
    "pandas>=1.5,<2",
    "numpy>=1.21,<2",
    "pyodbc>=5,<6",
    "psycopg2-binary>=2.9.9,<3",
    "oracledb>=3.4.2,<4",
    "mysql-connector-python>=9,<10",
    "pymongo>=3.10.1,<4",
    "JayDeBeApi>=1.2.3,<2",
    "JPype1>=1.5,<2",
    "paramiko>=3.4,<5",
]

[tool.setuptools.packages.find]
include = ["ddp_connectors*"]
